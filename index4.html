<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFLI 2026</title>
  <style>
    :root{--green:#2e8b57;--green-light:#3cb371}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:linear-gradient(135deg,#f0f9f0 0%,#e6f4f1 100%);padding:25px;line-height:1.6;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    
    .container{max-width:800px;margin:0 auto;background:rgba(255,255,255,.95);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    
    .section{margin-bottom:40px;padding:0 30px;scroll-margin-top:80px}
    .section h2{color:var(--green);font-size:24px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-weight:600}
    
    /* ===== RESPONSIVE GALLERY WITH DYNAMIC HEIGHT ===== */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }
    
    /* Media and Sponsor images - maintain aspect ratio without whitespace */
    .gallery img {
      width: 30%; /* Maximum width */
      height: auto; /* Height adjusts proportionally */
      aspect-ratio: 3 / 2; /* Maintain consistent aspect ratio */
      object-fit: contain; /* Show full image without cropping */
      border-radius: 15px;
      display: block;
      background: transparent;
    }
    
    /* Alternative: If images have different aspect ratios, use object-fit: cover */
    .gallery.cover-style img {
      object-fit: cover;
      aspect-ratio: 16 / 9;
    }
    
    /* For square logos */
    .gallery.square-style img {
      aspect-ratio: 1 / 1;
      object-fit: contain;
    }
    
    /* Responsive breakpoints */
    @media (max-width: 768px) {
      .gallery img {
        width: 45%;
      }
    }
    
    @media (max-width: 480px) {
      .gallery img {
        width: 100%;
        max-width: 300px;
      }
    }
    
    /* Speaker gallery - different styling */
    .speaker {
      text-align: center;
      flex: 1 1 300px;
      max-width: 400px;
    }
    
    .speaker img {
      width: 80%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .footer{background:linear-gradient(135deg,var(--green) 0%,var(--green-light) 100%);color:#fff;text-align:center;padding:40px 30px}
  </style>
</head>
<body>

<div class="container">
  
  <!-- Media Section -->
  <div class="section" id="media">
    <h2>Media Partners</h2>
    <div class="gallery">
      <img src="Media/Media1.jpeg" alt="Media Outlet 1">
      <img src="Media/Media2.jpeg" alt="Media Outlet 2">
      <img src="Media/Media3.jpeg" alt="Media Outlet 3">
    </div>
  </div>
  
  <!-- Sponsors Section -->
  <div class="section" id="sponsors">
    <h2>Sponsors</h2>
    <div class="gallery">
      <img src="Sponsors/Sponsor1.jpeg" alt="Sponsor 1">
      <img src="Sponsors/Sponsor2.jpeg" alt="Sponsor 2">
      <img src="Sponsors/Sponsor3.jpeg" alt="Sponsor 3">
      <img src="Sponsors/Sponsor4.jpeg" alt="Sponsor 4">
    </div>
  </div>
  
  <div class="footer">
    <p>&copy; 2026 African First Ladies Initiative</p>
  </div>
  
</div>

</body>
</html>

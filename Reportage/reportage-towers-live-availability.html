function price(type, floor) {
  const d = floor - 3;
  if (type === 0) return Math.round(66152 + d * 354);
  if (type === 1) return Math.round(95979 + d * 514.5);
  return Math.round(182508 + d * 977.5);
}

function aed(usd) { return Math.round(usd * 3.67); }

function parseData() {
  return RAW.split(',').map(c => {
    const tower = c[0];
    const type = parseInt(c[c.length-2]);
    const view = parseInt(c[c.length-1]);
    const unum = c.slice(1, -2);
    const floor = parseInt(unum.length > 3 ? unum.slice(0,2) : unum[0]);
    const pr = price(type, floor);
    return {
      unit: tower + '-' + unum,
      tower, floor,
      floorLabel: floor + (floor===3?'rd':'th') + ' Floor',
      type, view,
      typeLabel: TYPES[type],
      typeCode: TYPEC[type],
      viewLabel: VIEWS[view],
      area: AREAS[type],
      sqft: SQFTS[type],
      priceUSD: pr,
      priceAED: aed(pr)
    };
  });

    {k:'tower',l:'Tower'},
    {k:'floorLabel',l:'Floor'},
    {k:'typeCode',l:'Type'},
    {k:'viewLabel',l:'View'},
    {k:'area',l:'Area (m²)'},
    {k:'priceUSD',l:'Price (USD)'},
    {k:'priceAED',l:'Price (AED)'},
    {k:null,l:'WhatsApp'}
  ];
  let html = '<thead><tr>' + headers.map(h => h.k
    ? `<th onclick="setSort('${h.k}')">${h.l}${sortCol===h.k?(sortAsc?' ▲':' ▼'):''}</th>`
    : `<th class="wa-table-header">${h.l}</th>`).join('') + '</tr></thead><tbody>';
  html += pageData.map(u => {
    const waMsg = encodeURIComponent(
      'Hello! Thank you for reaching out to us via WhatsApp. We are pleased to assist us today.\n\n' +
      'Our choice of unit at Reportage Towers:\n\n' +
      `• Unit: ${u.unit}\n• Tower: ${u.tower}\n• Floor: ${u.floorLabel}\n• Type: ${u.typeLabel} (${u.typeCode})\n• View: ${u.viewLabel}\n• Price: ${fmt(u.priceUSD)} (${fmtA(u.priceAED)})\n\n` +
      'Please let us know your next steps. Thank you!');
    return `<tr>` +
      `<td data-label="Unit"><strong>${u.unit}</strong></td>` +
      `<td data-label="Tower">${u.tower}</td>` +
      `<td data-label="Floor">${u.floorLabel}</td>` +
      `<td data-label="Type"><span class="rt-tag rt-tag-${u.type}">${u.typeCode}</span></td>` +
      `<td data-label="View">${u.viewLabel}</td>` +
      `<td data-label="Area">${u.area} <span style="color:#bbb;font-size:11px">/ ${u.sqft} sq ft</span></td>` +
      `<td data-label="Price (USD)" class="rt-price">${fmt(u.priceUSD)}</td>` +
      `<td data-label="Price (AED)" style="color:#666">${fmtA(u.priceAED)}</td>` +
      `<td data-label="WhatsApp" class="wa-cell"><a class="wa-cta" target="_blank" rel="noopener" href="https://wa.me/251922466797?text=${waMsg}" aria-label="Inquire about unit ${u.unit} via WhatsApp"><i class="fa-brands fa-whatsapp"></i> Inquire</a></td>` +
      `</tr>`;
  }).join('');
  html += '</tbody>';
  $('table').innerHTML = html;
}

function renderCards() {
  sortData();
  const start = (page-1)*PER;
  const pageData = filtered.slice(start, start+PER);
  const el = $('cards');
  if (pageData.length === 0) {
    el.innerHTML = '<div class="rt-empty">No units match your filters.</div>';
    return;
  }
  el.innerHTML = pageData.map((u,i) => {
    const waMsg = encodeURIComponent(
      'Hello! Thank you for reaching out to us through WhatsApp. We are pleased to assist us today.\n\n' +
      'Our choice of unit at Reportage Towers:\n\n' +
      `• Unit: ${u.unit}\n• Tower: ${u.tower}\n• Floor: ${u.floorLabel}\n• Type: ${u.typeLabel} (${u.typeCode})\n• View: ${u.viewLabel}\n• Price: ${fmt(u.priceUSD)} (${fmtA(u.priceAED)})\n\n` +
      'Please let us know your next steps. Thank you!');
    return `<div class="ucard" id="ucard-${i}">` +
      `<button class="ucard-head" onclick="toggleCard(${i})" aria-expanded="false">` +
        `<div class="ucard-title"><strong>${u.unit}</strong> <span class="rt-tag rt-tag-${u.type}">${u.typeCode}</span></div>` +
        `<div class="ucard-meta">Tower ${u.tower} &middot; ${u.floorLabel} &middot; ${u.viewLabel}</div>` +
        `<div class="ucard-price">${fmt(u.priceUSD)}</div>` +
        `<span class="ucard-chev">&#9662;</span>` +
      `</button>` +
      `<div class="ucard-body">` +
        `<div class="ucard-row"><span>Area</span><span>${u.area} m&sup2; / ${u.sqft} sq ft</span></div>` +
        `<div class="ucard-row"><span>Price (AED)</span><span>${fmtA(u.priceAED)}</span></div>` +
        `<a class="wa-cta ucard-wa" target="_blank" rel="noopener" href="https://wa.me/251922466797?text=${waMsg}" aria-label="Inquire about unit ${u.unit} via WhatsApp"><i class="fa-brands fa-whatsapp"></i> Inquire on WhatsApp</a>` +
      `</div>` +
    `</div>`;
  }).join('');
}

window.toggleCard = function(i) {
  const card = document.getElementById('ucard-' + i);
  card.classList.toggle('open');
  const head = card.querySelector('.ucard-head');
  head.setAttribute('aria-expanded', card.classList.contains('open'));
};

function renderPaging() {
  const totalPages = Math.ceil(filtered.length / PER);
  if (totalPages <= 1) { $('paging').innerHTML = ''; return; }
  const from = (page-1)*PER + 1;
  const to = Math.min(filtered.length, page*PER);
  let btns = `<button onclick="setPage(${page-1})" ${page===1?'disabled':''}>Prev</button>`;
  const maxBtns = 1;
  let s = Math.max(1, page - 3);
  let e = Math.min(totalPages, s + maxBtns - 1);
  if (e - s < maxBtns - 1) s = Math.max(1, e - maxBtns + 1);
  if (s > 1) btns += `<button onclick="setPage(1)">1</button>` + (s > 2 ? `<span style="padding:4px">…</span>` : '');
  for (let i = s; i <= e; i++) btns += `<button class="${i===page?'active':''}" onclick="setPage(${i})">${i}</button>`;
  if (e < totalPages) btns += (e < totalPages - 1 ? `<span style="padding:4px">…</span>` : '') + `<button onclick="setPage(${totalPages})">${totalPages}</button>`;
  btns += `<button onclick="setPage(${page+1})" ${page===totalPages?'disabled':''}>Next</button>`;
  $('paging').innerHTML = `<span>Showing ${from}-${to} of ${filtered.length}</span><div class="rt-paging-btns">${btns}</div>`;
}

function applyFilters() {
  const tw = $('flt-tower').value;
  const ty = $('flt-type').value;
  const vw = $('flt-view').value;
  const sr = $('flt-search').value.trim().toLowerCase();
  filtered = ALL.filter(u => {
    if (tw && u.tower !== tw) return false;
    if (ty !== '' && u.type !== parseInt(ty)) return false;
    if (vw !== '' && u.view !== parseInt(vw)) return false;
    if (sr && !u.unit.toLowerCase().includes(sr)) return false;
    return true;
  });
  page = 1;
  renderStats();
  renderTable(); renderCards();
  renderPaging();
}

window.setSort = function(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderTable(); renderCards();
};

window.setPage = function(p) {
  const totalPages = Math.ceil(filtered.length / PER);
  if (p < 1 || p > totalPages) return;
  page = p;
  renderTable(); renderCards();
  renderPaging();
};

['flt-tower','flt-type','flt-view','flt-search'].forEach(id => {
  const el = $(id);
  el.addEventListener('change', applyFilters);
  if (el.tagName === 'INPUT') el.addEventListener('input', applyFilters);
});

applyFilters();
</script>
